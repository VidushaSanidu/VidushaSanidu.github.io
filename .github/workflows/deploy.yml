name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          VITE_GITHUB_USERNAME: VidushaSanidu
          VITE_GOOGLE_SCRIPT_URL: https://script.google.com/macros/s/AKfycbyDp9fM44oQLO7n8TKNp_ye9xtZbeyiBhV_t4O4cY2WJFVWrDF3P3DMtsfX9DkxD5hd/exec
          VITE_CONTACT_EMAIL: vidushsanidu07@gmail.com
          VITE_HF_SPACE_URL: https://liuyuelintop-career-chatbots.hf.space
          VITE_HF_SPACE_SPACE_URL: https://huggingface.co/spaces/liuyuelintop/career_chatbots
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

